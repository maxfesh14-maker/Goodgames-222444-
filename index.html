<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOOD GAMES PORTAL</title>
    <!-- Подключение Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --main: #FBC02D; --bg: #080808; --card: #121212; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Экран техработ */
        #m-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        
        /* Шапка с ссылкой на портал */
        header { background: #111; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .logo { font-size: 26px; font-weight: 900; color: var(--main); letter-spacing: 2px; text-decoration: none; }
        .header-links { display: flex; align-items: center; gap: 20px; }
        .portal-link { color: #aaa; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .portal-link:hover { color: var(--main); }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        /* МАСШТАБ СЕТКИ (Крупные карточки) */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .game-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #222; transition: 0.3s; }
        .game-card:hover { transform: translateY(-8px); border-color: var(--main); box-shadow: 0 10px 30px rgba(251, 192, 45, 0.1); }
        .game-img { width: 100%; height: 200px; object-fit: cover; background: #1a1a1a; border-bottom: 1px solid #222; }
        .game-info { padding: 20px; text-align: center; }

        /* Кнопки */
        .btn { padding: 12px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; box-sizing: border-box; margin-top: 10px; }
        .btn-main { background: var(--main); color: #000; }
        .btn-main:active { transform: scale(0.95); }
        .btn-rev { background: transparent; border: 1px solid #333; color: #888; }
        .btn-link { background: none; color: var(--main); border: none; cursor: pointer; text-decoration: underline; margin-top: 15px; font-size: 14px; }

        /* Модальные окна */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-content { background: #111; padding: 30px; border-radius: 25px; width: 350px; border: 1px solid var(--main); text-align: center; }
        input, textarea { width: 100%; padding: 14px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 10px; box-sizing: border-box; }
        
        .rev-item { background: #000; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: left; border-left: 3px solid var(--main); font-size: 14px; }
        .badge { background: var(--main); color: #000; padding: 2px 6px; border-radius: 5px; font-size: 11px; margin-left: 5px; font-weight: bold; }
    </style>
</head>
<body>

<!-- Экран техработ -->
<div id="m-screen">
    <h1 style="font-size: 60px;">🚧</h1>
    <h2 style="color: var(--main);">ТЕХНИЧЕСКИЕ РАБОТЫ</h2>
    <p id="m-reason" style="color: #666;"></p>
</div>

<header>
    <a href="#" class="logo">GOOD GAMES</a>
    <div class="header-links">
        <a href="https://xfesh14-maker.github.io/" target="_blank" class="portal-link">Главный портал</a>
        <div id="auth-zone">
            <button class="btn btn-main" style="width:auto; margin:0;" onclick="openM('modal-auth')">ВХОД</button>
        </div>
    </div>
</header>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px;">
        <h2 style="margin:0; font-size: 28px;">Библиотека игр</h2>
        <button id="add-btn" class="btn btn-main" style="display:none; width:auto; margin:0;" onclick="openM('modal-pub')">+ Опубликовать</button>
    </div>
    
    <div id="game-list" class="game-grid">
        <!-- Сюда загружаются игры -->
    </div>
</div>

<!-- Окно Авторизации и Восстановления -->
<div id="modal-auth" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--main); margin-top:0">Аккаунт</h2>
        <input id="u-n" placeholder="Никнейм">
        <input id="u-p" type="password" placeholder="Пароль">
        
        <button class="btn btn-main" onclick="auth()">ВОЙТИ</button>
        <button class="btn btn-rev" style="border-color:var(--main); color:var(--main)" onclick="reg()">РЕГИСТРАЦИЯ</button>
        
        <button class="btn-link" onclick="recoverPass()">Забыл пароль?</button>
        <button class="btn btn-rev" onclick="closeM()">ЗАКРЫТЬ</button>
    </div>
</div>

<!-- Окно Отзывов -->
<div id="modal-rev" class="modal">
    <div class="modal-content">
        <h3 id="rev-game-name" style="color:var(--main); margin-top:0">Отзывы</h3>
        <div id="rev-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>
        <div id="rev-input-zone" style="display:none">
            <textarea id="rev-text" placeholder="Твой отзыв..."></textarea>
            <button class="btn btn-main" onclick="sendReview()">ОТПРАВИТЬ</button>
        </div>
        <button class="btn btn-rev" onclick="closeM()">ЗАКРЫТЬ</button>
    </div>
</div>

<!-- Окно Публикации -->
<div id="modal-pub" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--main)">Новая игра</h2>
        <input id="g-t" placeholder="Название игры">
        <input id="g-l" placeholder="Ссылка на игру (URL)">
        <input id="g-i" placeholder="Ссылка на обложку (URL)">
        <button class="btn btn-main" onclick="publish()">ОПУБЛИКОВАТЬ</button>
        <button class="btn btn-rev" onclick="closeM()">ОТМЕНА</button>
    </div>
</div>

<script>
    // КОНФИГУРАЦИЯ FIREBASE
    const config = { 
        databaseURL: "https://goodgames-222444-default-rtdb.firebaseio.com" 
    };
    firebase.initializeApp(config);
    const db = firebase.database();
    let user = null, curG = null;

    // 1. Техработы
    db.ref('maintenance').on('value', s => {
        const m = s.val() || {};
        document.getElementById('m-screen').style.display = m.status ? 'flex' : 'none';
        document.getElementById('m-reason').innerText = m.reason || "Идет обновление...";
    });

    // 2. Загрузка игр
    db.ref('games').on('value', s => {
        const grid = document.getElementById('game-list'); grid.innerHTML = "";
        const data = s.val();
        if(data) {
            Object.entries(data).reverse().forEach(([id, g]) => {
                grid.innerHTML += `
                    <div class="game-card">
                        <img src="${g.img || 'https://via.placeholder.com/400x200'}" class="game-img">
                        <div class="game-info">
                            <b style="font-size:18px;">${g.title}</b><br>
                            <small style="color:#666">От: ${g.author}</small><br>
                            <a href="${g.link}" target="_blank" class="btn btn-main" style="margin-top:15px; text-decoration:none; display:block;">ИГРАТЬ</a>
                            <button class="btn btn-rev" onclick="openReviews('${id}', '${g.title}')">ОТЗЫВЫ</button>
                        </div>
                    </div>`;
            });
        } else {
            grid.innerHTML = "<p style='color:#777'>Игр пока нет. Зарегистрируйся и добавь первую!</p>";
        }
    });

    // 3. Авторизация
    function auth() {
        const n = document.getElementById('u-n').value.trim();
        const p = document.getElementById('u-p').value.trim();
        if(!n || !p) return alert("Введите данные!");

        db.ref('users/' + n).once('value', s => {
            const d = s.val();
            if(d && d.pass === p) {
                user = { nick: n, ...d };
                document.getElementById('auth-zone').innerHTML = `<b>${n}</b>${d.verified ? '<span class="badge">V</span>' : ''}`;
                
                // Только верифицированные пользователи могут публиковать игры
                if(d.verified) {
                    document.getElementById('add-btn').style.display = 'block';
                }
                closeM();
            } else alert("Ошибка: Неверный ник или пароль!");
        });
    }

    // 4. Регистрация
    function reg() {
        const n = document.getElementById('u-n').value.trim();
        const p = document.getElementById('u-p').value.trim();
        if(n.length < 3 || p.length < 3) return alert("Ник и пароль от 3 символов!");

        db.ref('users/' + n).once('value', s => {
            if(s.exists()) {
                alert("Этот ник уже занят!");
            } else {
                db.ref('users/' + n).set({ pass: p, verified: false, vip: false })
                    .then(() => alert("Успешно! Теперь нажмите ВОЙТИ."))
                    .catch(e => alert("Ошибка базы данных."));
            }
        });
    }

    // 5. Восстановление пароля
    function recoverPass() {
        const n = prompt("Введите ваш никнейм для восстановления:");
        if(!n) return;
        
        db.ref('users/' + n).once('value', s => {
            if(s.exists()) {
                const newPass = prompt("Пользователь найден! Придумайте новый пароль:");
                if(newPass && newPass.length >= 3) {
                    db.ref('users/' + n).update({ pass: newPass })
                        .then(() => alert("Пароль успешно изменен! Вы можете войти."));
                } else {
                    alert("Пароль слишком короткий или отменен.");
                }
            } else {
                alert("Такого пользователя не существует!");
            }
        });
    }

    // 6. Отзывы
    function openReviews(id, title) {
        curG = id;
        document.getElementById('rev-game-name').innerText = title;
        document.getElementById('rev-input-zone').style.display = user ? 'block' : 'none';
        
        db.ref('reviews').orderByChild('gameID').equalTo(id).on('value', s => {
            const list = document.getElementById('rev-list'); list.innerHTML = "";
            if(s.val()) {
                Object.values(s.val()).reverse().forEach(r => {
                    list.innerHTML += `<div class="rev-item"><b>${r.author}:</b> ${r.text}</div>`;
                });
            } else {
                list.innerHTML = "<p style='color:#444'>Отзывов пока нет.</p>";
            }
        });
        openM('modal-rev');
    }

    function sendReview() {
        const t = document.getElementById('rev-text').value.trim();
        if(!t) return;
        db.ref('reviews').push({ gameID: curG, author: user.nick, text: t });
        document.getElementById('rev-text').value = "";
    }

    // 7. Публикация
    function publish() {
        if(!user || !user.verified) return alert("Только верифицированные пользователи могут добавлять игры.");
        
        const t = document.getElementById('g-t').value.trim();
        const l = document.getElementById('g-l').value.trim();
        const i = document.getElementById('g-i').value.trim();
        if(!t || !l) return alert("Название и ссылка обязательны!");
        
        db.ref('games').push({ title: t, link: l, img: i, author: user.nick });
        closeM();
    }

    function openM(id) { document.getElementById(id).style.display = 'flex'; }
    function closeM() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
</script>
</body>
</html>
